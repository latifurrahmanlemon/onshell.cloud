<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onshell</title>
    <!--
      The renderer loads nothing from the network. `connect-src 'none'` is the
      teeth behind that: even if a UI bug rendered attacker-controlled markup,
      it has nowhere to send what it found. All traffic belongs to the main
      process, which holds the tokens.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
