# electron-builder configuration for Onshell Desktop.
#
# Developer ID signing is driven entirely by environment variables, so this file
# needs no edit when the certificates arrive. Without them the custom hook uses
# an ad-hoc integrity signature; set the variables in CI secrets and the same
# build turns out Developer ID signed:
#
#   macOS       CSC_LINK, CSC_KEY_PASSWORD           (Developer ID Application .p12, base64 or path)
#               APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (notarization)
#   Windows     CSC_LINK, CSC_KEY_PASSWORD           (Authenticode .pfx)
#
# With none of them set, electron-builder produces ad-hoc-signed installers.
# Tagged releases publish those builds with checksums and clear Gatekeeper
# instructions until Apple Developer access is available; supplying all secrets
# upgrades the same pipeline to Developer ID signed and notarized output.
#
# An auto-updater is a remote code execution channel by construction, which is
# why the workflow that produces these artifacts lives in this repository where
# anyone can read what went into a build they are about to install.

appId: cloud.onshell.desktop
productName: Onshell
copyright: Copyright © Onshell

# Installer filenames are set explicitly because the default is built from the
# package name, and this is a scoped workspace package: `@onshell/desktop` made
# fpm treat the `@onshell` segment as a directory and fail with "Parent directory
# does not exist". It also keeps spaces out of the download names.
artifactName: onshell-desktop-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# The bundled main, preload, renderer, and tray icons. Everything else is folded
# into the bundle by esbuild, so there are no workspace symlinks for asar to trip
# over.
files:
  - dist/**/*
  - "!**/*.map"

# node-pty and ssh2 ship native code; asar must not swallow it or dlopen fails.
asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/ssh2/**"
  - "**/node_modules/cpu-features/**"

npmRebuild: true

mac:
  category: public.app-category.developer-tools
  # electron-builder v25 otherwise skips signing completely when no Developer
  # ID exists. The custom hook applies an ad-hoc signature in that case and the
  # real identity when one is present, before DMG/ZIP creation.
  sign: scripts/sign-mac.cjs
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs from scripts/notarize.cjs (afterSign) only when the Apple
  # credentials are present, so an ad-hoc local build does not try to notarize.

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # NSIS packs every listed arch into one installer that picks the right payload
  # at install time, so it must not be named per-arch: with `${arch}` in the name
  # electron-builder emits the combined installer *and* one per arch, i.e. three
  # downloads for the same thing.
  artifactName: onshell-desktop-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Per-user install and startup keep the app off the machine-wide, admin-only
  # path — it opens shells as you, and it should never be able to open one as
  # SYSTEM.

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
  # Names the binary, the .desktop file and the icon inside the package. The
  # default is derived from the package name, which is scoped, so it would have
  # produced `@onshelldesktop.desktop`.
  executableName: onshell-desktop

deb:
  # Debian package names may not contain capitals or spaces, and the default
  # falls back to productName ("Onshell"). fpm warns and downcases, which is
  # fine, but naming it explicitly keeps it stable if productName ever changes.
  packageName: onshell-desktop
  # libsecret backs Electron's safeStorage on Linux. Without it the app still
  # runs, but every launch asks the user to sign in again — so it is a real
  # dependency rather than an optional nicety.
  depends:
    - libsecret-1-0
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1

afterSign: scripts/notarize.cjs
