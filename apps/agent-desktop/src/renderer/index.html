<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Connect this computer</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #1a1a2e;
        background: #fbfbfd;
        padding: 28px 26px;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e8e8f0; background: #16161d; }
        input { background: #22222c; color: #fff; border-color: #333340; }
        .hint { color: #9a9aa8; }
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.hint { color: #6a6a78; margin: 0 0 20px; font-size: 12.5px; }
      label { display: block; font-weight: 600; font-size: 12px; margin: 14px 0 6px; letter-spacing: .01em; }
      input {
        width: 100%; padding: 11px 12px; font-size: 15px; border: 1px solid #d5d5e0;
        border-radius: 9px; background: #fff; outline: none;
      }
      input#code { font: 600 20px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; }
      input:focus { border-color: #6b5cff; box-shadow: 0 0 0 3px rgba(107,92,255,.18); }
      button {
        margin-top: 20px; width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
        color: #fff; background: #6b5cff; border: 0; border-radius: 9px; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      .msg { margin-top: 14px; font-size: 12.5px; min-height: 18px; }
      .msg.err { color: #e5484d; }
      .msg.ok { color: #30a46c; }
      .done { text-align: center; padding-top: 30px; }
      .done .tick { font-size: 40px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="form-view">
      <h1>Connect this computer</h1>
      <p class="hint">
        In the console, open <strong>My computers → Connect a computer</strong> to get an
        eight-character code. It is good for ten minutes and can be used once.
      </p>

      <label for="code">Pairing code</label>
      <input id="code" placeholder="K7QP-2M4X" autocomplete="off" spellcheck="false" maxlength="9" />

      <label for="name">Name for this computer <span style="font-weight:400">(optional)</span></label>
      <input id="name" placeholder="e.g. Work MacBook" autocomplete="off" />

      <button id="submit" disabled>Connect</button>
      <div class="msg" id="msg"></div>
    </div>

    <div id="done-view" class="done hidden">
      <div class="tick">✓</div>
      <h1>This computer is connected</h1>
      <p class="hint" id="done-detail"></p>
    </div>

    <script>
      const codeEl = document.getElementById("code");
      const nameEl = document.getElementById("name");
      const btn = document.getElementById("submit");
      const msg = document.getElementById("msg");

      // Accept "k7qp2m4x" or "K7QP-2M4X" and normalise to the dashed, upper form.
      function normalise(raw) {
        const clean = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        return clean.length > 4 ? clean.slice(0, 4) + "-" + clean.slice(4) : clean;
      }

      codeEl.addEventListener("input", () => {
        const pos = codeEl.value.length;
        codeEl.value = normalise(codeEl.value);
        btn.disabled = codeEl.value.replace(/[^A-Z0-9]/g, "").length !== 8;
        void pos;
      });

      async function submit() {
        btn.disabled = true;
        msg.className = "msg";
        msg.textContent = "Connecting…";
        const result = await window.onshell.pair(codeEl.value, nameEl.value);
        if (result.ok) {
          document.getElementById("form-view").classList.add("hidden");
          const done = document.getElementById("done-view");
          document.getElementById("done-detail").textContent = result.ownerEmail
            ? result.ownerEmail + " can now open this computer from any browser. You can close this window; the agent keeps running in the menu bar."
            : "You can close this window; the agent keeps running in the menu bar.";
          done.classList.remove("hidden");
        } else {
          msg.className = "msg err";
          msg.textContent = result.message || "That code did not work. Get a fresh one and try again.";
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", submit);
      codeEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !btn.disabled) submit();
      });
      codeEl.focus();
    </script>
  </body>
</html>
