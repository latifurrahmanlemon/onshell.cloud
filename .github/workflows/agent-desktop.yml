name: Agent desktop

# Builds the desktop-app packaging of the agent — the .dmg / .exe / AppImage a
# non-technical user double-clicks — as opposed to agent-release.yml, which
# builds the headless CLI tarball. electron-builder produces the installer for
# each OS on that OS.
#
# Signing is driven by secrets, never by a file edit. Set them and the same run
# turns out signed and (on macOS) notarized; leave them unset and it produces
# working unsigned installers for internal testing. See electron-builder.yml.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Read-only: the release is created on the public onshell-downloads repo with a
# PAT (DOWNLOADS_TOKEN), not with the automatic token, so this job never needs
# write access to this repository. Checkout is all it uses the token for.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # windows-2022, not windows-latest: latest is now Server 2025, whose
          # Visual Studio the node-gyp bundled with @electron/rebuild cannot
          # detect ("Could not find any Visual Studio installation to use"), so
          # the node-pty rebuild dies before packaging starts.
          - os: windows-2022
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    # electron-builder downloads platform toolchains and rebuilds node-pty; a
    # leg that has not finished in 40 minutes is stuck, not slow.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Two setup-node calls: Corepack must be active before `cache: yarn` shells
      # out to `yarn cache dir`, or the runner's Yarn 1.22 answers and refuses a
      # repo pinned to yarn@4.6.0. Same note as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # node-pty is a native module, so electron-builder rebuilds it against
      # Electron's ABI through node-gyp — and the gyp bundled with
      # @electron/rebuild still does `from distutils.version import StrictVersion`.
      # distutils was removed from the standard library in Python 3.12, which is
      # what the runners now default to, so the rebuild dies with
      # "ModuleNotFoundError: No module named 'distutils'". 3.11 is the newest
      # version that still ships it. (setuptools also provides a shim, which is
      # why this passes on developer machines that happen to have it installed.)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: yarn install --immutable

      # Through turbo, not `yarn workspace … build`: the agent core imports
      # @onshell/agent-protocol, and only turbo honours the `dependsOn: ["^build"]`
      # in turbo.json that builds that package first. Calling the workspace script
      # directly runs tsc against a package whose dist does not exist yet on a
      # clean checkout, which fails with "Cannot find module
      # '@onshell/agent-protocol'" and a cascade of ResolvedShell errors behind it.
      - run: yarn turbo build --filter=@onshell/agent
      - run: yarn workspace @onshell/agent-desktop build

      - name: Package installers
        working-directory: apps/agent-desktop
        shell: bash
        # An unset secret still arrives as a *defined but empty* environment
        # variable, and electron-builder treats an empty CSC_LINK as a path to a
        # certificate: it resolves "" against the cwd and dies with
        # "<appDir> not a file". So the empty ones are removed here rather than
        # merely set to false — declaring them below is what makes them present.
        # When the certificates arrive, the same block leaves them alone and the
        # build signs.
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done

          if [ -z "${CSC_LINK:-}" ]; then
            # No certificate: keep electron-builder from signing with whatever
            # Developer ID happens to sit in the runner's keychain, so an
            # unsigned build is a deliberate, reproducible outcome.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate supplied — building unsigned."
          else
            echo "Signing certificate present — building signed."
          fi

          yarn electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # So electron-builder never tries to authenticate for a publish.
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: onshell-agent-desktop-${{ matrix.platform }}
          # The installers, not the unpacked app dirs or blockmaps.
          path: |
            apps/agent-desktop/release/*.dmg
            apps/agent-desktop/release/*.zip
            apps/agent-desktop/release/*.exe
            apps/agent-desktop/release/*.AppImage
            apps/agent-desktop/release/*.deb
          if-no-files-found: warn

      # On a tag, attach this leg's installers to a GitHub Release — installers
      # are ~90-100 MB and there are six per version, so committing them would
      # bloat the git history permanently.
      #
      # The release is published on the separate, *public* onshell-downloads
      # repository rather than this one. Release assets inherit the visibility of
      # their repository, and this repo is private, so a download link here
      # answers 404 to everyone who is not a collaborator — which defeats the
      # point of shipping an installer to end users. Publishing across repos is
      # also why this needs DOWNLOADS_TOKEN: the automatic github.token is scoped
      # to this repository alone and cannot write a release anywhere else.
      #
      # `gh release create` races across the three legs; `|| true` makes the
      # loser of that race fall straight through to upload against the release the
      # winner made. shell: bash normalises globbing on the Windows runner too.
      - name: Publish installers to the public downloads repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DOWNLOADS_REPO: latifurrahmanlemon/onshell-downloads
        run: |
          set -euo pipefail

          # Fail loudly rather than finishing green having published nothing: a
          # tag build whose installers reach no one is a failed release.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DOWNLOADS_TOKEN is not set, so the installers cannot be published to $DOWNLOADS_REPO."
            exit 1
          fi

          cd apps/agent-desktop/release
          version="${GITHUB_REF_NAME#desktop-v}"

          # Written line by line rather than as one indented multi-line string:
          # this block is indented inside the YAML, and four leading spaces turn a
          # Markdown line into a code block, which would render the whole release
          # note as grey monospace.
          printf '%s\n' \
            'Desktop installers for the Onshell Agent — no Node, no terminal, nothing to pre-install.' \
            '' \
            'These builds are **unsigned** while code-signing certificates are being set up, so your computer will warn about an unidentified developer:' \
            '' \
            '- **macOS:** right-click the app and choose Open. Or run `xattr -dr com.apple.quarantine "/Applications/Onshell Agent.app"`' \
            '- **Windows:** click More info, then Run anyway' \
            '' \
            'Install it, then paste the pairing code from **My computers → Connect a computer**.' \
            > release-notes.md

          # Three legs race to create the release; the two that lose fall through
          # to upload against the one the winner made. The tag does not exist in
          # the downloads repo, so `gh release create` makes it there, off that
          # repo's default branch.
          gh release view "$GITHUB_REF_NAME" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$DOWNLOADS_REPO" \
                 --title "Onshell Agent Desktop $version" \
                 --notes-file release-notes.md \
            || true

          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers produced on this leg."
            exit 0
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$DOWNLOADS_REPO" --clobber
