name: Agent desktop

# Builds the desktop-app packaging of the agent — the .dmg / .exe / AppImage a
# non-technical user double-clicks — as opposed to agent-release.yml, which
# builds the headless CLI tarball. electron-builder produces the installer for
# each OS on that OS.
#
# Signing is driven by secrets, never by a file edit. Set them and the same run
# turns out signed and (on macOS) notarized; leave them unset and it produces
# working unsigned installers for internal testing. See electron-builder.yml.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# A tag push attaches the built installers to a GitHub Release, so the job needs
# write access to repository contents. Manual runs only upload artifacts and use
# no more than the default read.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    # electron-builder downloads platform toolchains and rebuilds node-pty; a
    # leg that has not finished in 40 minutes is stuck, not slow.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Two setup-node calls: Corepack must be active before `cache: yarn` shells
      # out to `yarn cache dir`, or the runner's Yarn 1.22 answers and refuses a
      # repo pinned to yarn@4.6.0. Same note as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      # The desktop app imports the compiled agent core, so build it first.
      - run: yarn workspace @onshell/agent build
      - run: yarn workspace @onshell/agent-desktop build

      - name: Package installers
        working-directory: apps/agent-desktop
        run: yarn electron-builder --${{ matrix.platform }} --publish never
        env:
          # macOS signing + notarization. All no-ops when the secrets are absent.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # GitHub token so electron-builder never tries to auth for publish.
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: onshell-agent-desktop-${{ matrix.platform }}
          # The installers, not the unpacked app dirs or blockmaps.
          path: |
            apps/agent-desktop/release/*.dmg
            apps/agent-desktop/release/*.zip
            apps/agent-desktop/release/*.exe
            apps/agent-desktop/release/*.AppImage
            apps/agent-desktop/release/*.deb
          if-no-files-found: warn

      # On a tag, attach this leg's installers to the matching GitHub Release.
      # A release is used rather than a repo commit on purpose: each installer is
      # ~90-100 MB and there are six, so committing them would bloat the git
      # history permanently. The release is public, so downloading needs no login
      # — the reason the old Actions-artifact approach was abandoned.
      #
      # `gh release create` races across the three legs; `|| true` makes the
      # loser of that race fall straight through to upload against the release the
      # winner made. shell: bash normalises globbing on the Windows runner too.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/agent-desktop/release
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "Onshell Agent Desktop $version" \
            --notes "Desktop installers for the Onshell Agent.

          These builds are **unsigned** while code-signing certificates are being set up, so your OS will warn about an unidentified developer:
          - **macOS:** right-click the app → Open, or run \`xattr -dr com.apple.quarantine '/Applications/Onshell Agent.app'\`
          - **Windows:** More info → Run anyway

          Requires nothing pre-installed — the runtime is bundled." || true
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            echo "No installers produced on this leg."
          fi
