name: Desktop app

# Builds Onshell Desktop — the .dmg / .exe / AppImage a person double-clicks —
# as opposed to agent-release.yml, which builds the headless CLI agent tarball.
# electron-builder produces the installer for each OS on that OS.
#
# This file is public on purpose. An installer with an auto-updater is a remote
# code execution channel, and the only honest answer to "what is in the binary
# you want me to run as myself" is a build recipe anyone can read.
#
# Signing is driven by secrets, never by a file edit. Manual runs may produce
# unsigned artifacts for internal testing. A tagged macOS release is required
# to be Developer ID signed and notarized; publishing a build that Gatekeeper
# sends to Trash is worse than failing the release loudly.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Read-only: the release is published on the separate onshell-downloads repo
# with a PAT (DOWNLOADS_TOKEN), not with the automatic token, so this job never
# needs write access here. Checkout is all it uses the token for.
#
# It stays on that repo rather than moving here now that this one is public,
# because the download page and every link already handed out point there, and
# a release history that jumps repositories mid-product is worse than one that
# lives somewhere slightly odd. Set the DOWNLOADS_REPO variable to override —
# a fork will want it pointing at its own repository.
permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require macOS signing and notarization for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          LEGACY_CSC_LINK: ${{ secrets.CSC_LINK }}
          LEGACY_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export CSC_LINK="${MAC_CSC_LINK:-${LEGACY_CSC_LINK:-}}"
          export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-${LEGACY_CSC_KEY_PASSWORD:-}}"
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release blocked before any platform publishes. Missing macOS release secrets: ${missing[*]}"
            exit 1
          fi

  build:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # windows-2022, not windows-latest: latest is now Server 2025, whose
          # Visual Studio the node-gyp bundled with @electron/rebuild cannot
          # detect ("Could not find any Visual Studio installation to use"), so
          # the node-pty rebuild dies before packaging starts.
          - os: windows-2022
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    # electron-builder downloads platform toolchains and rebuilds node-pty and
    # ssh2; a leg that has not finished in 40 minutes is stuck, not slow.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Two setup-node calls: Corepack must be active before `cache: yarn` shells
      # out to `yarn cache dir`, or the runner's Yarn 1.22 answers and refuses a
      # repo pinned to yarn@4.6.0. Same note as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # node-pty is a native module, so electron-builder rebuilds it against
      # Electron's ABI through node-gyp — and the gyp bundled with
      # @electron/rebuild still does `from distutils.version import StrictVersion`.
      # distutils was removed from the standard library in Python 3.12, which is
      # what the runners now default to, so the rebuild dies with
      # "ModuleNotFoundError: No module named 'distutils'". 3.11 is the newest
      # version that still ships it. (setuptools also provides a shim, which is
      # why this passes on developer machines that happen to have it installed.)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: yarn install --immutable

      # Through turbo, not `yarn workspace … build`: the desktop app imports the
      # agent core and the API client, and only turbo honours the
      # `dependsOn: ["^build"]` in turbo.json that builds those first. Calling
      # the workspace script directly runs against packages whose dist does not
      # exist yet on a clean checkout.
      - run: yarn turbo build --filter=@onshell/agent --filter=@onshell/api-client
      - run: yarn workspace @onshell/desktop build

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        # An unset secret still arrives as a *defined but empty* environment
        # variable, and electron-builder treats an empty CSC_LINK as a path to a
        # certificate: it resolves "" against the cwd and dies with
        # "<appDir> not a file". So the empty ones are removed here rather than
        # merely set to false — declaring them below is what makes them present.
        # When the certificates arrive, the same block leaves them alone and the
        # build signs.
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done

          case "${{ matrix.platform }}" in
            mac)
              export CSC_LINK="${MAC_CSC_LINK:-${LEGACY_CSC_LINK:-}}"
              export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-${LEGACY_CSC_KEY_PASSWORD:-}}"
              ;;
            win)
              export CSC_LINK="${WIN_CSC_LINK:-${LEGACY_CSC_LINK:-}}"
              export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD:-${LEGACY_CSC_KEY_PASSWORD:-}}"
              ;;
            *)
              unset CSC_LINK CSC_KEY_PASSWORD
              ;;
          esac

          if [ "${{ matrix.platform }}" = mac ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            missing=()
            for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then missing+=("$name"); fi
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Refusing to publish an unsigned macOS app. Missing: ${missing[*]}"
              echo "Add a Developer ID Application certificate plus Apple notarization credentials to repository secrets."
              exit 1
            fi
          fi

          if [ -z "${CSC_LINK:-}" ]; then
            # No certificate: keep electron-builder from signing with whatever
            # Developer ID happens to sit in the runner's keychain, so an
            # unsigned build is a deliberate, reproducible outcome.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate supplied — building unsigned."
          else
            echo "Signing certificate present — building signed."
          fi

          yarn electron-builder --${{ matrix.platform }} --publish never

          if [ "${{ matrix.platform }}" = mac ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            verified=0
            while IFS= read -r -d '' app_path; do
              codesign --verify --deep --strict --verbose=2 "$app_path"
              spctl --assess --type execute --verbose=2 "$app_path"
              verified=$((verified + 1))
            done < <(find release -type d -name 'Onshell.app' -print0)
            if [ "$verified" -lt 2 ]; then
              echo "::error::Expected signed arm64 and x64 Onshell.app bundles, found $verified."
              exit 1
            fi
          fi
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          LEGACY_CSC_LINK: ${{ secrets.CSC_LINK }}
          LEGACY_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # So electron-builder never tries to authenticate for a publish.
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: onshell-desktop-${{ matrix.platform }}
          # The installers, not the unpacked app dirs or blockmaps.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: warn

      # On a tag, attach this leg's installers to a GitHub Release — installers
      # are ~90-100 MB and there are six per version, so committing them would
      # bloat the git history permanently.
      #
      # `gh release create` races across the three legs; `|| true` makes the
      # loser of that race fall straight through to upload against the release
      # the winner made. shell: bash normalises globbing on the Windows runner.
      # Only on a tag: a manual run is for checking that the three legs still
      # build, and it must not quietly publish a release nobody asked for.
      - name: Publish installers
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'latifurrahmanlemon/onshell-downloads' }}
        run: |
          set -euo pipefail

          # Fail loudly rather than finishing green having published nothing: a
          # tag build whose installers reach no one is a failed release.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DOWNLOADS_TOKEN is not set, so the installers cannot be published to $DOWNLOADS_REPO."
            exit 1
          fi

          cd apps/desktop/release
          version="${GITHUB_REF_NAME#desktop-v}"

          # Written line by line rather than as one indented multi-line string:
          # this block is indented inside the YAML, and four leading spaces turn
          # a Markdown line into a code block, which would render the whole
          # release note as grey monospace.
          printf '%s\n' \
            'Onshell Desktop — your own machine'"'"'s terminal, direct SSH to your servers, and the Onshell console in one app.' \
            '' \
            'The macOS builds are Developer ID signed and notarized for Gatekeeper. The Windows installer is Authenticode signed when the Windows certificate is configured.' \
            '' \
            '- **macOS:** drag Onshell to Applications and open it normally. If Gatekeeper rejects the app, do not bypass it; report the release version and macOS version.' \
            '- **Windows:** install per-user. An unsigned development build may still show SmartScreen; public releases should use the signed setup.' \
            '' \
            'On first launch it asks which Onshell server to use — the hosted one, or your own deployment.' \
            > release-notes.md

          gh release view "$GITHUB_REF_NAME" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$DOWNLOADS_REPO" \
                 --title "Onshell Desktop $version" \
                 --notes-file release-notes.md \
            || true

          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers produced on this leg."
            exit 0
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$DOWNLOADS_REPO" --clobber
