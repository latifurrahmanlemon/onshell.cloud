name: CI

# The default branch is `master`. While this said `main` the workflow matched
# nothing and CI never ran once — which is how a migration that only works on a
# case-insensitive MySQL reached production.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: onshell_cloud
          MYSQL_USER: onshell
          MYSQL_PASSWORD: onshell
          MYSQL_ROOT_PASSWORD: onshell
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ponshell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mysql://onshell:onshell@localhost:3306/onshell_cloud
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      MASTER_ENCRYPTION_KEY: ci-master-key
      PUBLIC_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      GATEWAY_BASE_URL: http://localhost:4100
      CORS_ORIGINS: http://localhost:3000
      # ADMIN_EMAIL / ADMIN_PASSWORD are deliberately unset. NODE_ENV is not
      # production here, so the seed mints a random admin password and prints
      # it. A real password committed to a public workflow is a credential in
      # every clone and every fork, and deleting it from HEAD does not remove
      # it from history.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check:migrations
      - run: yarn db:generate
      # MySQL on Linux is case-sensitive about table names, so this step is what
      # actually proves a migration will apply on the server.
      - run: yarn db:deploy
      - run: yarn db:seed
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
