name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: onshell_cloud
          MYSQL_USER: onshell
          MYSQL_PASSWORD: onshell
          MYSQL_ROOT_PASSWORD: onshell
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ponshell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mysql://onshell:onshell@localhost:3306/onshell_cloud
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      MASTER_ENCRYPTION_KEY: ci-master-key
      PUBLIC_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      GATEWAY_BASE_URL: http://localhost:4100
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: latifur.tech@gmial.com
      ADMIN_PASSWORD: "Lemon553&"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn db:generate
      - run: yarn db:deploy
      - run: yarn db:seed
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
